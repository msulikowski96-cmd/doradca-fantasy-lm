<!doctype html>

<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%231C6842'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3ELM%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#EDF1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09101B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">LM</div>
      <div>
        <h1>Doradca Fantasy LM</h1>
        <p id="nextInfo">Sofascore Fantasy · Liga Mistrzów 2026/27</p>
      </div>
    </div>
    <div class="sync" id="sync" data-s="saved">Zapisano w przeglądarce</div>
  </header>

  <main>
    <section id="tab-squad" class="stack" role="tabpanel"></section>
    <section id="tab-round" class="stack" role="tabpanel" hidden></section>
    <section id="tab-history" class="stack" role="tabpanel" hidden></section>
    <section id="tab-rules" class="stack" role="tabpanel" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sekcje">
  <div class="tabs-in" role="tablist">
    <button class="tab-btn" role="tab" data-tab="squad" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/><circle cx="12" cy="12" r="3"/><path d="M8 3v4h8V3"/></svg>Skład</button>
    <button class="tab-btn" role="tab" data-tab="round" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.4 5.2 5.6.6-4.2 3.8 1.2 5.5L12 15.3 7 18.1l1.2-5.5L4 8.8l5.6-.6z"/></svg>Kolejka</button>
    <button class="tab-btn" role="tab" data-tab="history" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16"/><path d="M6 15l4-5 3 3 5-7"/></svg>Historia</button>
    <button class="tab-btn" role="tab" data-tab="rules" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>Zasady</button>
  </div>
</nav>

<script type="module" src="src/app.js"></script>

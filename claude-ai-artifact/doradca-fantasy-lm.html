<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column; Sofascore-style pitch board up top, tactical controls below, tab bar pinned to the bottom */
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --surface-2:#F5F7F2; --ink:#0F1E36; --muted:#586477; --line:#D5DCD1;
  --pitch:#1C6842; --pitch-2:#20744A; --chalk:rgba(255,255,255,.55);
  --chip-ink:#FFFFFF; --chip-label:rgba(5,28,16,.78); --shirt:#F4F6F2; --shirt-gk:#F2B705;
  --armband:#F2B705; --armband-ink:#251B00;
  --good:#1D7C46; --warn:#9A620A; --bad:#B4372A;
  --good-bg:#E1F1E6; --warn-bg:#FAEFD7; --bad-bg:#F7E1DC;
  --focus:#3B5BDB;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09101B; --surface:#111A29; --surface-2:#162133; --ink:#E5EAF1; --muted:#94A1B4; --line:#253248;
    --pitch:#134B31; --pitch-2:#165638; --chalk:rgba(255,255,255,.35);
    --chip-label:rgba(2,16,9,.8); --shirt:#E9EDE6; --shirt-gk:#F5C232;
    --armband:#F5C232;
    --good:#52C587; --warn:#E4AA3F; --bad:#F27A66;
    --good-bg:#11301E; --warn-bg:#33260E; --bad-bg:#3A1914;
    --focus:#8EA6FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09101B; --surface:#111A29; --surface-2:#162133; --ink:#E5EAF1; --muted:#94A1B4; --line:#253248;
  --pitch:#134B31; --pitch-2:#165638; --chalk:rgba(255,255,255,.35);
  --chip-label:rgba(2,16,9,.8); --shirt:#E9EDE6; --shirt-gk:#F5C232;
  --armband:#F5C232;
  --good:#52C587; --warn:#E4AA3F; --bad:#F27A66;
  --good-bg:#11301E; --warn-bg:#33260E; --bad-bg:#3A1914;
  --focus:#8EA6FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.45rem}
h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.04em}
.brand h1{font-size:1.5rem}
.brand p{font-size:.85rem;color:var(--muted)}
.sync{flex:none;font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="saved"]::before{background:var(--good)}
.sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="error"]::before{background:var(--bad)}

/* generic blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row > *{min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.92}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:8px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);flex:1 1 140px}
label.f .hint{font-weight:400}
input[type=text],input[type=number],textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-weight:400;font-size:.95rem;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.notice{border-radius:8px;padding:10px 12px;font-size:.9rem;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line)}
.notice.info{background:var(--surface-2)}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.issues li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.issues li.e::before{background:var(--bad)}
.issues li.w::before{background:var(--warn)}
.issues li.o::before{background:var(--good)}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* pitch */
.pitch{position:relative;overflow:hidden;border-radius:var(--r);padding:16px 6px 22px;display:flex;flex-direction:column;gap:14px;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 46px,var(--pitch-2) 46px 92px)}
.pitch::before{content:"";position:absolute;left:24%;right:24%;top:0;height:70px;border:2px solid var(--chalk);border-top:0}
.pitch::after{content:"";position:absolute;left:50%;bottom:-62px;width:130px;height:130px;border:2px solid var(--chalk);border-radius:50%;transform:translateX(-50%)}
.pitch .halfway{position:absolute;left:0;right:0;bottom:3px;border-top:2px solid var(--chalk)}
.prow{position:relative;z-index:1;display:flex;justify-content:center;gap:4px}
.pl{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px 5px;min-width:0;flex:0 1 104px;cursor:pointer;color:var(--chip-ink);border-radius:8px;position:relative}
.pl:hover .pl-name{outline:1px solid var(--chalk)}
.pl.sel{background:rgba(255,255,255,.14);box-shadow:0 0 0 2px var(--armband)}
.pl.swapsrc{box-shadow:0 0 0 2px var(--armband);background:rgba(245,194,50,.18)}
.shirt{width:34px;height:31px;background:var(--shirt);clip-path:polygon(20% 0,38% 0,50% 13%,62% 0,80% 0,100% 22%,87% 40%,80% 33%,80% 100%,20% 100%,20% 33%,13% 40%,0 22%);display:grid;place-items:center;padding-top:6px;font-family:var(--display);font-weight:700;font-size:.72rem;color:#1B2B1F}
.pl[data-pos="GK"] .shirt{background:var(--shirt-gk)}
.pl-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:.88rem;background:var(--chip-label);padding:1px 6px;border-radius:4px;line-height:1.35}
.pl-meta{font-family:var(--mono);font-size:.66rem;opacity:.9;white-space:nowrap}
.pl-pts{font-family:var(--mono);font-size:.66rem;background:var(--armband);color:var(--armband-ink);border-radius:3px;padding:0 4px}
.badge{position:absolute;top:0;left:calc(50% + 10px);width:19px;height:19px;border-radius:50%;background:var(--armband);color:var(--armband-ink);font-family:var(--display);font-weight:700;font-size:.75rem;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.badge.v{background:var(--surface);color:var(--ink)}
.bench{display:flex;justify-content:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px 6px;position:relative}
.bench .pl{color:var(--ink)}
.bench .pl-name{background:var(--surface);border:1px solid var(--line)}
.bench .shirt{background:var(--line);color:var(--ink)}
.bench .pl[data-pos="GK"] .shirt{background:var(--shirt-gk);color:#1B2B1F}
.bench-label{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 6px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* editor */
.ed-group{display:flex;flex-direction:column;gap:6px}
.ed-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) 76px;gap:6px}
.ed-head{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) 76px;gap:6px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ed-row input{padding:8px}

/* round */
.pts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pts-item{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;min-width:0}
.pts-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
.pts-item input{width:62px;flex:none;padding:6px;background:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{flex:1 1 0;min-width:96px;text-align:center;padding:8px 6px;cursor:pointer;font-weight:600;font-size:.88rem;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer;background:var(--surface-2)}
.check input{accent-color:var(--ink)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
details[open] summary{margin-bottom:8px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.timer{font-family:var(--mono);font-size:.85rem}

/* recommendation */
.rec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.summary{font-size:1rem}
.tr{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tr-line{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px}
.tr-line + .tr-line{border-top:1px dashed var(--line)}
.tag{font-family:var(--display);font-weight:700;font-size:.78rem;text-align:center;border-radius:4px;padding:2px 0;letter-spacing:.06em}
.tag.out{background:var(--bad-bg);color:var(--bad)}
.tag.in{background:var(--good-bg);color:var(--good)}
.tr-in-fields{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) 70px;gap:6px}
.tr-in-fields input{padding:6px 8px;font-size:.88rem}
.tr-reason{padding:8px 10px;background:var(--surface-2);font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.xi-list{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.xi-list b{font-family:var(--display);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;margin-right:6px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}

/* history */
.hist-item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.hist-item:first-of-type{border-top:0;padding-top:0}
.hist-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hist-top strong{font-family:var(--display);font-size:1.15rem}
.spark{width:100%;height:auto;display:block}
.orig-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 12px;font-size:.9rem}
.orig-list .gone{color:var(--muted);text-decoration:line-through}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab-btn{appearance:none;border:0;background:none;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tab-btn svg{width:22px;height:22px}
.tab-btn[aria-selected="true"]{color:var(--ink)}
.tab-btn[aria-selected="true"] svg{color:var(--ink)}
.tab-btn[aria-selected="true"]::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--armband);margin-top:1px}

@media (max-width:420px){
  .ed-row,.ed-head{grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) 64px}
  .tr-in-fields{grid-template-columns:1fr 1fr}
  .tr-in-fields input:last-child{grid-column:span 2}
  .pl-meta{font-size:.6rem}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.pl{transition:background-color .15s,border-color .15s,box-shadow .15s}
}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const r1 = n => Math.round(Number(n) * 10) / 10;
const fmt = n => (isFinite(Number(n)) && n !== "" && n !== null) ? r1(n).toFixed(1) : "–";
const newId = () => "p" + Math.random().toString(36).slice(2, 9);
function norm(s){
  return String(s || "").replace(/[øØ]/g,"o").replace(/[łŁ]/g,"l").replace(/[đĐ]/g,"d").replace(/ß/g,"ss").replace(/[æÆ]/g,"ae")
    .normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
}
function canonClub(c){
  const n = norm(c); if(!n) return "";
  const exact = CLUBS.find(x => norm(x) === n); if(exact) return exact;
  if(ALIAS[n]) return ALIAS[n];
  if(n.length >= 4){
    const hits = CLUBS.filter(x => norm(x).includes(n));
    if(hits.length === 1) return hits[0];
  }
  return String(c).trim();
}
const short = c => SHORT[c] || String(c || "?").slice(0,3).toUpperCase();
const lastName = n => { const parts = String(n || "").trim().split(/\s+/); return parts.length > 1 ? parts.slice(1).join(" ") : parts[0] || "?"; };
function normPos(p){
  const n = norm(p);
  if(["gk","bramkarz","goalkeeper","g"].includes(n)) return "GK";
  if(["def","d","obronca","defender"].includes(n)) return "DEF";
  if(["mid","m","pomocnik","midfielder"].includes(n)) return "MID";
  if(["fwd","f","napastnik","forward","att","st"].includes(n)) return "FWD";
  return null;
}
function findByName(players, name){
  const n = norm(name); if(!n) return null;
  let p = players.find(x => norm(x.name) === n); if(p) return p;
  let hits = players.filter(x => { const xn = norm(x.name); return xn.includes(n) || n.includes(xn); });
  if(hits.length === 1) return hits[0];
  const last = n.split(" ").pop();
  hits = players.filter(x => norm(x.name).split(" ").pop() === last);
  return hits.length === 1 ? hits[0] : null;
}
const fmtDate = d => new Intl.DateTimeFormat("pl-PL",{timeZone:"Europe/Warsaw",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(d);
function roundInfo(){
  const now = Date.now();
  const next = ROUNDS.find(r => new Date(r.ko).getTime() - 30*60000 > now);
  if(!next) return {next:null, done:8};
  return {next, done:next.n - 1, deadline:new Date(new Date(next.ko).getTime() - 30*60000)};
}

function freshState(){
  return {v:1, updatedAt:0, rules:clone(DEFAULT_RULES), style:"balanced",
    chips:{wildcard:true,freehit:true,triplecaptain:true},
    original:null, current:null, rounds:[], draftRound:{}, pendingRec:null, freeHit:null};
}
function normalize(s){
  const f = freshState(); s = clone(s || {});
  const out = Object.assign(f, s);
  out.rules = Object.assign(clone(DEFAULT_RULES), s.rules || {});
  out.rules.squad = Object.assign(clone(DEFAULT_RULES.squad), (s.rules||{}).squad || {});
  out.rules.formation = Object.assign(clone(DEFAULT_RULES.formation), (s.rules||{}).formation || {});
  out.chips = Object.assign({wildcard:true,freehit:true,triplecaptain:true}, s.chips || {});
  out.rounds = Array.isArray(s.rounds) ? s.rounds : [];
  out.draftRound = s.draftRound && typeof s.draftRound === "object" ? s.draftRound : {};
  return out;
}

function setSync(s){

  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  if(docRef){ clearTimeout(writeTimer); writeTimer = setTimeout(flush, 700); }
}
async function flush(){
  if(!docRef) return;
  if(writing){ writeAgain = true; return; }
  writing = true; setSync("saving");
  try{ await docRef.set(clone(state)); setSync("saved"); }
  catch(e){ setSync("error"); }
  writing = false;
  if(writeAgain){ writeAgain = false; flush(); }
}
async function initStore(){
  if(!window.claude || typeof claude.use !== "function"){ setSync("local"); return; }
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setSync("local"); return; }
    docRef = db.doc("data/users/" + uid + "/state");
    const snap = await docRef.get();
    if(snap.exists){
      const remote = snap.data();
      if((remote.updatedAt || 0) >= (state.updatedAt || 0)){
        state = normalize(remote);
        try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
        renderAll();
        setSync("saved");
      } else { flush(); }
    } else if(state.updatedAt){ flush(); }
    else setSync("saved");
    docRef.onSnapshot(s => {
      if(!s.exists || s.metadata.hasPendingWrites || writing) return;
      const r = s.data();
      if((r.updatedAt || 0) > (state.updatedAt || 0)){
        state = normalize(r);
        try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
        renderAll();
      }
    }, () => setSync("error"));
  }catch(e){ docRef = null; setSync("local"); }
}

/* ---------- validation ---------- */
function validateSquad(players, bank, rules){
  const errors = [], warns = [];
  const counts = {GK:0,DEF:0,MID:0,FWD:0};
  players.forEach(p => { if(counts[p.pos] != null) counts[p.pos]++; });
  POS.forEach(pos => { if(counts[pos] !== rules.squad[pos]) errors.push(`${POS_PL[pos]}: ${counts[pos]} zamiast ${rules.squad[pos]}.`); });
  const empty = players.filter(p => !String(p.name).trim()).length;
  if(empty) errors.push(`Brakuje nazwisk: ${empty} ${empty === 1 ? "miejsce" : "miejsc"} bez zawodnika.`);
  const seen = {};
  players.forEach(p => { const n = norm(p.name); if(!n) return; if(seen[n]) errors.push(`${p.name} jest w składzie dwa razy.`); seen[n] = 1; });
  const byClub = {};
  players.forEach(p => { if(!p.club) return; byClub[p.club] = (byClub[p.club] || 0) + 1; });
  Object.entries(byClub).forEach(([c, n]) => { if(n > rules.maxPerClub) errors.push(`Za dużo zawodników z klubu ${c}: ${n} (limit ${rules.maxPerClub}).`); });
  const noClub = players.filter(p => String(p.name).trim() && !p.club).length;
  if(noClub) warns.push(`${noClub} zawodnik(ów) bez klubu – limit na klub nie jest dla nich sprawdzany.`);
  const unknown = [...new Set(players.filter(p => p.club && !CLUBS.includes(p.club)).map(p => p.club))];
  if(unknown.length) warns.push(`Nieznany klub: ${unknown.join(", ")}. Sprawdź, czy gra w fazie ligowej LM.`);
  const noPrice = players.filter(p => String(p.name).trim() && !isFinite(parseFloat(p.price))).length;
  if(noPrice) errors.push(`Brak ceny u ${noPrice} zawodnik(ów).`);
  if(isFinite(bank) && bank < -0.05) errors.push(`Przekroczony budżet o ${fmt(-bank)} M€.`);
  return {errors, warns, counts};
}
function lineupProblems(players, xi, rules){
  const probs = [];
  const ids = new Set(players.map(p => p.id));
  if(xi.length !== 11 || new Set(xi).size !== 11 || xi.some(id => !ids.has(id))){ probs.push("Jedenastka musi mieć 11 różnych zawodników ze składu."); return probs; }
  const c = {GK:0,DEF:0,MID:0,FWD:0};
  xi.forEach(id => { const p = players.find(x => x.id === id); c[p.pos]++; });
  POS.forEach(pos => { const [mn, mx] = rules.formation[pos]; if(c[pos] < mn || c[pos] > mx) probs.push(`${POS_PL[pos]} w jedenastce: ${c[pos]} (dozwolone ${mn === mx ? mn : mn + "–" + mx}).`); });
  return probs;
}
function autoLineup(players){
  const by = pos => players.filter(p => p.pos === pos);
  const take = {GK:1, DEF:4, MID:4, FWD:2};
  if(by("FWD").length < 2){ take.FWD = by("FWD").length; take.MID = Math.min(5, by("MID").length); take.DEF = 11 - 1 - take.MID - take.FWD; }
  const xi = [];
  POS.forEach(pos => by(pos).slice(0, take[pos]).forEach(p => xi.push(p.id)));
  const bench = players.filter(p => !xi.includes(p.id)).sort((a,b) => (a.pos === "GK" ? -1 : 0) - (b.pos === "GK" ? -1 : 0)).map(p => p.id);
  return {xi, bench};
}
function benchOrder(players, xi, preferred){
  const rest = players.filter(p => !xi.includes(p.id));
  const gk = rest.filter(p => p.pos === "GK");
  const out = rest.filter(p => p.pos !== "GK");
  if(preferred && preferred.length) out.sort((a,b) => { const ia = preferred.indexOf(a.id), ib = preferred.indexOf(b.id); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  return [...gk, ...out].map(p => p.id);
}

/* evaluate an AI recommendation against the rules */
function evalRec(rec){
  const cur = state.current, rules = state.rules, d = state.draftRound;
  const errors = [], warns = [];
  let players = cur.players.map(p => ({...p}));
  let bank = Number(cur.bank) || 0;
  const swaps = {}, list = [];
  (rec.transfers || []).forEach((t, i) => {
    const out = cur.players.find(p => p.id === t.outId) || findByName(cur.players, t.outName || t.outId);
    const inn = t.in || {};
    if(!out){ errors.push(`Transfer ${i+1}: nie wiadomo, kogo sprzedać.`); return; }
    if(swaps[out.id]){ errors.push(`${out.name} jest sprzedawany dwa razy.`); return; }
    const pos = normPos(inn.pos) || out.pos;
    const price = parseFloat(inn.price);
    if(!String(inn.name || "").trim()){ errors.push(`Transfer ${i+1}: brak nazwiska kupowanego zawodnika.`); return; }
    const already = players.find(p => !swaps[p.id] && p.id !== out.id && norm(p.name) === norm(inn.name));
    if(already){ errors.push(`${inn.name} już jest w składzie.`); }
    if(!isFinite(price)) errors.push(`${inn.name}: brak ceny.`);
    if(pos !== out.pos) warns.push(`${inn.name} (${POS_ONE[pos]}) zastępuje ${out.name} (${POS_ONE[out.pos]}).`);
    if(inn.priceConfirmed === false) warns.push(`Sprawdź w aplikacji cenę: ${inn.name} (${fmt(price)} M€).`);
    const tmp = "t" + i;
    swaps[out.id] = tmp;
    bank = bank + Number(out.price) - (isFinite(price) ? price : 0);
    const idx = players.findIndex(p => p.id === out.id);
    players[idx] = {id:tmp, temp:true, name:String(inn.name).trim(), club:canonClub(inn.club), pos, price:isFinite(price) ? r1(price) : null};
    list.push({out, inn:players[idx], reason:t.reason || ""});
  });
  bank = r1(bank);
  const sq = validateSquad(players, bank, rules);
  errors.push(...sq.errors);
  sq.warns.forEach(w => { if(!warns.includes(w)) warns.push(w); });
  const chip = rec.chip && CHIPS.some(c => c.key === rec.chip) ? rec.chip : null;
  if(chip && !state.chips[chip]) errors.push(`Chip ${CHIPS.find(c => c.key === chip).label} został już wykorzystany.`);
  const free = (d.free !== undefined && d.free !== "") ? Number(d.free) : rules.freeTransfers;
  const unlimited = chip === "wildcard" || chip === "freehit";
  const hits = unlimited ? 0 : Math.max(0, list.length - free);
  if(hits) warns.push(`${hits} transfer(y) ponad darmowe: −${hits * rules.hitCost} pkt.`);
  // lineup
  const xiP = (rec.startingXI || []).map(n => findByName(players, n)).filter(Boolean);
  const xiIds = [...new Set(xiP.map(p => p.id))];
  let lineupOk = xiIds.length === 11 && lineupProblems(players, xiIds, rules).length === 0;
  let xi = null, bench = null;
  if(lineupOk){
    xi = xiIds;
    const pref = (rec.bench || []).map(n => findByName(players, n)).filter(Boolean).map(p => p.id);
    bench = benchOrder(players, xi, pref);
  } else if((rec.startingXI || []).length){
    warns.push("Jedenastka od AI nie pasuje do zasad. Zostanie obecne ustawienie (nowi zawodnicy wejdą na miejsca sprzedanych).");
  }
  const capP = findByName(players, rec.captain), viceP = findByName(players, rec.vice);
  const inXI = p => p && (xi ? xi.includes(p.id) : (cur.xi.includes(p.id) || Object.entries(swaps).some(([o, t]) => t === p.id && cur.xi.includes(o))));
  let captain = inXI(capP) ? capP.id : null;
  let vice = inXI(viceP) && (!capP || viceP.id !== capP.id) ? viceP.id : null;
  if(rec.captain && !captain) warns.push(`Kapitan „${rec.captain}” nie jest w jedenastce – zostanie obecny.`);
  return {errors, warns, players, bank, swaps, list, chip, hits, free, xi, bench, lineupOk, captain, vice};
}

function cleanRec(res){
  const cur = state.current;
  const transfers = (Array.isArray(res.transfers) ? res.transfers : []).map(t => {
    t = t || {};
    const out = cur.players.find(p => p.id === t.outId) || findByName(cur.players, t.outName || t.outId || t.out);
    const inn = t.in || {};
    return {outId: out ? out.id : String(t.outId || ""), outName: out ? out.name : String(t.outName || t.outId || ""),
      in:{name:String(inn.name || "").trim(), club:canonClub(inn.club), pos:normPos(inn.pos) || (out ? out.pos : "MID"), price: isFinite(parseFloat(inn.price)) ? r1(inn.price) : "", priceConfirmed: inn.priceConfirmed === true},
      reason:String(t.reason || "")};
  });
  const arr = a => Array.isArray(a) ? a.map(x => String(x)) : [];
  return {summary:String(res.summary || ""), transfers, chip: CHIPS.some(c => c.key === res.chip) ? res.chip : null, chipReason:String(res.chipReason || ""),
    captain:String(res.captain || ""), vice:String(res.vice || ""), startingXI:arr(res.startingXI), bench:arr(res.bench),
    watchlist:(Array.isArray(res.watchlist) ? res.watchlist : []).slice(0,6).map(w => ({name:String((w||{}).name || ""), club:String((w||{}).club || ""), note:String((w||{}).note || "")})),
    risks:arr(res.risks).slice(0,6)};
}

async function runAnalysis(fix){
  if(!aiReady() || ui.aiBusy) return;
  if(!state.current){ ui.aiMsg = "Najpierw zapisz swój skład w zakładce Skład."; renderRound(); return; }
  maybeRevertFreeHit(true);
  const prompt = buildPrompt(fix);
  const done = currentDone();
  ui.aiBusy = true; ui.aiMsg = ""; ui.ctl = new AbortController(); ui.started = Date.now();
  renderRound();
  ui.timer = setInterval(() => { const el = $("#aiTimer"); if(el) el.textContent = Math.round((Date.now() - ui.started) / 1000) + " s"; }, 1000);
  try{
    const opts = {signal:ui.ctl.signal, modelTier:"complex", cache:false};
    if(ui.roundImages.length && sampleImages) opts.images = ui.roundImages.slice();
    const res = await sampleFn.json(prompt, opts);
    if(!res || typeof res !== "object" || Array.isArray(res)) throw {code:"invalid_json"};
    state.pendingRec = Object.assign(cleanRec(res), {forRound: done + 1, afterRound: done, createdAt: Date.now()});
    ui.aiMsg = "";

    const box = $("#recBox"); if(box && state.pendingRec && !ui.aiMsg) box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  }
}

/* ---------- squad ops ---------- */
function emptyDraft(){
  const players = [];
  POS.forEach(pos => { for(let i = 0; i < state.rules.squad[pos]; i++) players.push({id:newId(), name:"", club:"", pos, price:""}); });
  return {players, bank:null};
}
function exampleDraft(){
  const d = emptyDraft();
  EXAMPLE.forEach(([name, club, pos, price]) => { const slot = d.players.find(x => x.pos === pos && !x.name); if(slot) Object.assign(slot, {name, club, price}); });
  d.example = true;
  return d;
}
function draftFromCurrent(){
  const cur = state.current;
  const d = emptyDraft();
  POS.forEach(pos => {
    const have = cur.players.filter(p => p.pos === pos);
    const slots = d.players.filter(p => p.pos === pos);
    slots.forEach((s, i) => { if(have[i]) Object.assign(s, clone(have[i])); });
  });
  d.bank = cur.bank;
  return d;
}
function draftValue(d){ return r1(d.players.reduce((s, p) => s + (parseFloat(p.price) || 0), 0)); }
function draftBank(d){ return (d.bank !== null && d.bank !== "" && isFinite(parseFloat(d.bank))) ? r1(d.bank) : r1(state.rules.budget - draftValue(d)); }
function saveDraft(){
  const d = ui.draft;
  const players = d.players.map(p => ({id:p.id, name:String(p.name).trim(), club:canonClub(p.club), pos:p.pos, price:parseFloat(p.price)}));
  const bank = draftBank(d);
  const v = validateSquad(players, bank, state.rules);
  if(v.errors.length) return;
  players.forEach(p => p.price = r1(p.price));
  const prev = state.current;
  let xi, bench, captain = null, vice = null;
  if(prev){
    const ids = new Set(players.map(p => p.id));
    xi = prev.xi.filter(id => ids.has(id));
    if(xi.length !== 11 || lineupProblems(players, xi, state.rules).length){ ({xi, bench} = autoLineup(players)); }
    else bench = benchOrder(players, xi, prev.bench);
    captain = xi.includes(prev.captain) ? prev.captain : null;
    vice = xi.includes(prev.vice) ? prev.vice : null;
  } else ({xi, bench} = autoLineup(players));
  if(!captain){ const fwd = xi.map(id => players.find(p => p.id === id)).filter(p => p.pos !== "GK").sort((a,b) => b.price - a.price); captain = fwd[0] ? fwd[0].id : xi[0]; }
  if(!vice || vice === captain){ const alt = xi.map(id => players.find(p => p.id === id)).filter(p => p.pos !== "GK" && p.id !== captain).sort((a,b) => b.price - a.price); vice = alt[0] ? alt[0].id : null; }
  state.current = {players, bank, xi, bench, captain, vice};
  if(!state.original || ui.setOrig) state.original = {players: clone(players), bank, savedAt: Date.now()};
  ui.editing = false; ui.draft = null; ui.setOrig = false; ui.importMsg = ""; ui.squadMsg = "Skład zapisany.";
  save(); renderAll();
}
function maybeRevertFreeHit(fromForm){
  const fh = state.freeHit; if(!fh) return;
  const done = fromForm ? currentDone() : roundInfo().done;
  if(done >= fh.round){
    state.current = fh.squadBefore; state.freeHit = null;
    ui.notice = `Free Hit z kolejki ${fh.round} się skończył. Przywrócono skład sprzed tej kolejki.`;
    save();
  }
}

/* apply recommendation */
function applyRec(){
  const rec = state.pendingRec; if(!rec || !state.current) return;
  const ev = evalRec(rec); if(ev.errors.length) return;
  const cur = state.current, before = clone(cur), d = state.draftRound;
  const idMap = {};
  const players = ev.players.map(p => { if(p.temp){ const nid = newId(); idMap[p.id] = nid; return {id:nid, name:p.name, club:p.club, pos:p.pos, price:p.price}; } return {id:p.id, name:p.name, club:p.club, pos:p.pos, price:p.price}; });
  const mapId = id => idMap[id] || id;
  const viaSwap = id => ev.swaps[id] ? mapId(ev.swaps[id]) : id;
  let xi, bench;
  if(ev.lineupOk){ xi = ev.xi.map(mapId); bench = ev.bench.map(mapId); }
  else { xi = cur.xi.map(viaSwap); bench = cur.bench.map(viaSwap); if(lineupProblems(players, xi, state.rules).length) ({xi, bench} = autoLineup(players)); }
  let captain = ev.captain ? mapId(ev.captain) : viaSwap(cur.captain);
  if(!xi.includes(captain)){ const c = xi.map(id => players.find(p => p.id === id)).filter(p => p.pos !== "GK").sort((a,b) => b.price - a.price)[0]; captain = c ? c.id : xi[0]; }
  let vice = ev.vice ? mapId(ev.vice) : viaSwap(cur.vice);
  if(!xi.includes(vice) || vice === captain){ const v = xi.map(id => players.find(p => p.id === id)).filter(p => p.pos !== "GK" && p.id !== captain).sort((a,b) => b.price - a.price)[0]; vice = v ? v.id : null; }
  if(ev.chip){ state.chips[ev.chip] = false; if(ev.chip === "freehit") state.freeHit = {round: rec.forRound, squadBefore: before}; }
  state.current = {players, bank: ev.bank, xi, bench, captain, vice};
  logRound({transfers: ev.list.map(t => ({out:t.out.name, in:t.inn.name, price:t.inn.price})), chip: ev.chip, hits: ev.hits, summary: rec.summary}, before.players);
  state.pendingRec = null;
  ui.squadMsg = ev.list.length ? `Zmiany zastosowane: ${ev.list.length} transfer(y). Wprowadź je też w Sofascore.` : "Ustawienie zapisane. Wprowadź je też w Sofascore.";
  save(); switchTab("squad");
}
function logRound(extra, roster){
  const d = state.draftRound;
  roster = roster || state.current.players;
  const n = currentDone();
  const pts = d.playerPts || {};
  const entry = Object.assign({n, points: d.total !== undefined ? d.total : "", playerPts: Object.entries(pts).filter(([,v]) => v !== "" && v != null).map(([id, v]) => { const p = roster.find(x => x.id === id); return {name: p ? p.name : "?", pts: Number(v)}; }).slice(0,15),
    transfers: [], chip: null, hits: 0, summary: "", savedAt: Date.now()}, extra || {});
  const i = state.rounds.findIndex(r => r.n === n);
  if(i >= 0){
    const old = state.rounds[i];
    entry.transfers = (old.transfers || []).concat(entry.transfers || []);
    entry.chip = entry.chip || old.chip; entry.hits = (old.hits || 0) + (entry.hits || 0); entry.summary = entry.summary || old.summary;
    state.rounds[i] = entry;
  } else state.rounds.push(entry);
  state.rounds.sort((a,b) => a.n - b.n);
  state.draftRound = {};
}

function onPlayerTap(pid){
  const cur = state.current;

    const where = id => xi.includes(id) ? ["xi", xi.indexOf(id)] : ["bench", bench.indexOf(id)];
    const [la, ia] = where(a), [lb, ib] = where(b);
    const L = {xi, bench};
    L[la][ia] = b; L[lb][ib] = a;
    const probs = lineupProblems(cur.players, xi, state.rules);
    if(probs.length){ ui.squadMsg = "Tej zamiany nie da się zrobić. " + probs.join(" "); renderSquad(); return; }

  ui.selected = ui.selected === pid ? null : pid;

function updateEditorIssues(){
  const d = ui.draft; if(!d) return;
  const players = d.players.map(p => ({name:p.name, club:canonClub(p.club), pos:p.pos, price:p.price}));

let draftTimer = null;
function draftSave(){ clearTimeout(draftTimer); draftTimer = setTimeout(save, 500); }
function bindRound(){
  const d = state.draftRound;

  bindVal("rTotal", "total"); bindVal("rNews", "news"); bindVal("rMarket", "market"); bindVal("rFree", "free");
  const fx = $("#rFixtures"); fx.addEventListener("input", () => { d.fixtures = fx.value; draftSave(); });
  const rd = $("#rDone"); rd.addEventListener("change", () => { const v = Math.max(1, Math.min(8, parseInt(rd.value) || 1)); d.done = v; save(); renderRound(); });
  document.querySelectorAll("#tab-round [data-pid]").forEach(i => { if(i.tagName !== "INPUT") return; i.addEventListener("input", () => { d.playerPts = d.playerPts || {}; d.playerPts[i.dataset.pid] = i.value; draftSave(); }); });
  document.querySelectorAll("#tab-round [data-chip]").forEach(c => c.addEventListener("change", () => { state.chips[c.dataset.chip] = c.checked; save(); if(state.pendingRec) renderRec(); }));

      <dt>Wicekapitan</dt><dd>${esc(ev.vice ? nameOf(ev.vice) : rec.vice || "bez zmian")}</dd>
      <dt>Chip</dt><dd>${ev.chip ? esc(CHIPS.find(c => c.key === ev.chip).label) : "nie teraz"}${rec.chipReason ? `<div class="small muted" style="font-weight:400">${esc(rec.chipReason)}</div>` : ""}</dd>
      <dt>Minusowe punkty</dt><dd class="num">${ev.hits ? "−" + ev.hits * state.rules.hitCost : "0"}</dd>

    ${rec.risks && rec.risks.length ? `<div><h3 style="margin-bottom:6px">Sprawdź przed terminem</h3><ul class="plain">${rec.risks.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : ""}

}

function renderHistory(){
  const el = $("#tab-history");
  const rounds = state.rounds;
  const withPts = rounds.filter(r => r.points !== "" && r.points != null && isFinite(Number(r.points)));
  const total = withPts.reduce((s, r) => s + Number(r.points), 0);
  let spark = "";
  if(withPts.length >= 2){
    const W = 320, H = 110, pl = 30, pr = 12, pt = 14, pb = 24;
    const vals = withPts.map(r => Number(r.points));
    const mx = Math.max(...vals), mn = Math.min(0, ...vals);
    const top = Math.ceil(mx / 20) * 20 || 20;
    const x = i => pl + (W - pl - pr) * (withPts.length === 1 ? 0.5 : i / (withPts.length - 1));
    const y = v => pt + (H - pt - pb) * (1 - (v - mn) / (top - mn));
    const pts = withPts.map((r, i) => `${x(i)},${y(Number(r.points))}`).join(" ");
    const area = `${x(0)},${y(mn)} ${pts} ${x(withPts.length - 1)},${y(mn)}`;
    spark = `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Punkty w kolejnych kolejkach">
      ${[mn, top / 2, top].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${Math.round(v)}</text>`).join("")}
      <polygon points="${area}" fill="var(--pitch)" opacity=".16"/>
      <polyline points="${pts}" fill="none" stroke="var(--pitch)" stroke-width="2.2" stroke-linejoin="round"/>
      ${withPts.map((r, i) => `<circle cx="${x(i)}" cy="${y(Number(r.points))}" r="${i === withPts.length - 1 ? 4.5 : 3}" fill="${i === withPts.length - 1 ? "var(--armband)" : "var(--pitch)"}" stroke="var(--surface)" stroke-width="1.5"/><text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">K${r.n}</text>`).join("")}
    </svg>`;
  }
  const cur = state.current;
  el.innerHTML = `
    <div class="stats">
      <div class="stat"><span>Punkty łącznie</span><b class="num">${withPts.length ? total : "–"}</b></div>
      <div class="stat"><span>Kolejek</span><b class="num">${rounds.length}</b></div>
      <div class="stat"><span>Transfery</span><b class="num">${rounds.reduce((s, r) => s + (r.transfers || []).length, 0)}</b></div>
    </div>
    ${spark ? `<div class="card"><h3>Punkty po kolejkach</h3>${spark}</div>` : ""}
    <div class="card"><h2>Kolejki</h2>
      ${rounds.length ? rounds.slice().reverse().map(r => `<div class="hist-item">
        <div class="hist-top"><strong>Kolejka ${r.n}</strong><span class="num">${r.points !== "" && r.points != null ? esc(r.points) + " pkt" : "pkt –"}</span></div>
        ${(r.transfers || []).length ? `<div class="small">${r.transfers.map(t => `${esc(t.out)} → <b>${esc(t.in)}</b>`).join(" · ")}</div>` : `<div class="small muted">Bez transferów</div>`}
        ${r.chip || r.hits ? `<div class="small muted">${r.chip ? "Chip: " + esc((CHIPS.find(c => c.key === r.chip) || {}).label || r.chip) : ""}${r.chip && r.hits ? " · " : ""}${r.hits ? "−" + r.hits * state.rules.hitCost + " pkt za transfery" : ""}</div>` : ""}
        ${(r.playerPts || []).length ? `<div class="small muted">${r.playerPts.slice().sort((a,b) => b.pts - a.pts).slice(0,3).map(p => esc(lastName(p.name)) + " " + p.pts).join(", ")}</div>` : ""}
      </div>`).join("") : `<p class="muted">Tu pojawi się każda kolejka: punkty, transfery i użyte chipy. Zapisuje się po zastosowaniu planu albo przycisku „Zapisz punkty bez zmian”.</p>`}
    </div>
    <div class="card"><h2>Pierwotny skład</h2>
      ${state.original ? `<p class="small muted">Zapisany ${new Intl.DateTimeFormat("pl-PL",{day:"numeric",month:"long"}).format(new Date(state.original.savedAt || Date.now()))}. Przekreśleni zostali już sprzedani.</p>
      <div class="orig-list">${state.original.players.map(p => { const kept = cur && cur.players.some(c => norm(c.name) === norm(p.name)); return `<span class="${kept ? "" : "gone"}">${p.pos} · ${esc(p.name)}</span>`; }).join("")}</div>` : `<p class="muted">Jeszcze nie zapisano składu.</p>`}
    </div>`;
}

      <div class="actions"><button class="btn" id="exCopy">Skopiuj kopię</button><span class="small muted" id="exMsg"></span></div>
      <label class="f" for="imText">Wczytaj kopię<textarea id="imText" placeholder="Wklej tutaj skopiowaną kopię danych"></textarea></label>
      <div class="actions"><button class="btn" id="imBtn">${ui.importArm ? "Na pewno zastąpić obecne dane?" : "Wczytaj"}</button><span class="small muted" id="imMsg"></span></div>
    </div>
    <div class="card"><h2>Zacznij od nowa</h2>
      <p class="small muted">Usuwa skład, pierwotny skład, historię i ustawienia.</p>
      <div class="actions"><button class="btn danger" id="resetAll">${ui.resetArm ? "Kliknij ponownie, żeby usunąć wszystko" : "Usuń wszystkie dane"}</button></div>
    </div>`;
  const num = (id, key) => $("#" + id).addEventListener("change", e => { const v = parseFloat(e.target.value); if(isFinite(v)){ r[key] = v; save(); } });
  num("ruBudget", "budget"); num("ruClub", "maxPerClub"); num("ruFree", "freeTransfers"); num("ruHit", "hitCost");
  $("#ruReset").addEventListener("click", () => { state.rules = clone(DEFAULT_RULES); save(); renderRules(); });
  $("#exCopy").addEventListener("click", () => {
    const txt = JSON.stringify(state);
    const done = () => $("#exMsg").textContent = "Skopiowano.";
    try{ navigator.clipboard.writeText(txt).then(done, () => { $("#imText").value = txt; $("#imText").select(); $("#exMsg").textContent = "Zaznaczono kopię w polu poniżej – skopiuj ją ręcznie."; }); }
    catch(e){ $("#imText").value = txt; $("#imText").select(); $("#exMsg").textContent = "Zaznaczono kopię w polu poniżej – skopiuj ją ręcznie."; }
  });
  $("#imBtn").addEventListener("click", () => {
    const raw = $("#imText").value.trim();
    if(!raw){ $("#imMsg").textContent = "Najpierw wklej kopię."; return; }
    let parsed; try{ parsed = JSON.parse(raw); }catch(e){ $("#imMsg").textContent = "To nie wygląda na kopię z tej aplikacji."; return; }
    if(!ui.importArm){ ui.importArm = true; const keep = raw; renderRules(); $("#imText").value = keep; return; }
    ui.importArm = false; state = normalize(parsed); save(); renderAll(); $("#imMsg") && ($("#imMsg").textContent = "Wczytano.");
  });
  $("#resetAll").addEventListener("click", () => {
    if(!ui.resetArm){ ui.resetArm = true; renderRules(); return; }
    ui.resetArm = false; state = freshState(); ui.draft = null; ui.editing = false; ui.roundImages = []; save(); renderAll(); switchTab("squad");
  });
}

function renderAll(){
  maybeRevertFreeHit(false);
  renderHeader();
  if(!ui.editing || !ui.draft) renderSquad();
  renderRound(); renderHistory(); renderRules();
}
function switchTab(t){
  ui.tab = t;
  document.querySelectorAll(".tab-btn").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  ["squad","round","history","rules"].forEach(k => { $("#tab-" + k).hidden = k !== t; });
  if(t !== "rules"){ ui.resetArm = false; ui.importArm = false; }
  if(t === "squad") renderSquad();
  if(t === "history") renderHistory();
  if(t === "rules") renderRules();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

renderAll();
initStore();
initSample();
})();
</script>
